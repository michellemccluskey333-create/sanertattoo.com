<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <title>Booking | Eric Saner Tattoo</title>
<meta name="description" content="Request a tattoo booking with Eric Saner." />

  <style>
    /* =========================================================
       THEME COLORS
    ========================================================= */
    :root {
      --bg: #080806;
      --bg-soft: #11100d;
      --card: #171510;
      --text: #f4e6b0;
      --muted: #d8c78f;
      --accent: #f0c44f;
      --red-accent: #b23a2a;
      --accent-soft: rgba(240, 196, 79, 0.16);
      --border: rgba(240, 196, 79, 0.28);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    /* =========================================================
       GLOBAL RESET
    ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top, #222 0%, var(--bg) 44%);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-wrap {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* =========================================================
       HEADER / NAVIGATION
    ========================================================= */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(13, 13, 13, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
    }

    .logo {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-family: Arial, sans-serif;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-dot {
      color: var(--red-accent);
      margin: 0 10px;
      font-size: 12px;
      opacity: 0.8;
    }

    /* =========================================================
       PAGE HERO
    ========================================================= */
    .page-hero {
      min-height: 72vh;
      display: flex;
      align-items: center;
      text-align: center;
      padding: 90px 0;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.78rem;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(3.2rem, 8vw, 7rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      margin-bottom: 24px;
      color: var(--text);
      text-shadow: 3px 3px 0 rgba(217, 74, 43, 0.35);
    }

    .page-hero p {
      max-width: 620px;
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 1.15rem;
    }

    /* =========================================================
       RED ACCENT LINE
    ========================================================= */
    .accent-line {
      width: 360px;
      height: 2px;
      margin: 24px auto;
      position: relative;
      background: linear-gradient(
        to right,
        transparent,
        var(--red-accent),
        transparent
      );
    }

    .accent-line::before {
      content: "✦";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--red-accent);
      font-size: 14px;
      line-height: 1;
    }

    /* =========================================================
       BUTTONS
    ========================================================= */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      font-family: Arial, sans-serif;
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .button.primary {
      background: linear-gradient(135deg, #f0c44f, #d9782f);
      color: #090806;
      border-color: #f0c44f;
      font-weight: 700;
    }

    .button:hover {
      border-color: var(--red-accent);
      color: var(--red-accent);
      transform: translateY(-2px);
      box-shadow: 0 0 0 2px rgba(178, 58, 42, 0.4);
    }

    .button.primary:hover {
      background: linear-gradient(135deg, #f0c44f, #b23a2a);
      color: #090806;
    }

    /* =========================================================
       COMING SOON CARD
    ========================================================= */
    .coming-soon-card {
      background: linear-gradient(145deg, rgba(199,166,107,0.14), rgba(255,255,255,0.03));
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 56px 36px;
      box-shadow: var(--shadow);
    }

    .coming-soon-badge {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid var(--red-accent);
      color: var(--red-accent);
      border-radius: 999px;
      font-family: Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .page-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }

    /* =========================================================
       FOOTER
    ========================================================= */
    footer {
      padding: 32px 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */
    @media (max-width: 820px) {
      .nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .nav-links {
        gap: 14px;
        font-size: 0.72rem;
      }

      .page-hero {
        min-height: auto;
        padding: 70px 0;
      }
    }

    @media (max-width: 520px) {
      .site-wrap {
        width: min(100% - 28px, 1120px);
      }

      h1 {
        font-size: clamp(3rem, 14vw, 5rem);
      }

      .accent-line {
        width: 260px;
      }

      .coming-soon-card {
        padding: 42px 24px;
      }
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header>
    <div class="site-wrap nav">
      <a href="index.html" class="logo">
        <span class="nav-dot">✦</span> Eric Saner Tattoo <span class="nav-dot">✦</span>
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="work.html">Work</a>
        <span class="nav-dot">✦</span>
        <a href="about.html">About</a>
        <span class="nav-dot">✦</span>
        <a href="booking.html">Booking</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- BOOKING PORTAL COMING SOON -->
    <section class="page-hero">
      <div class="site-wrap">
       <div class="coming-soon-badge">Booking</div>

        <div class="eyebrow">Booking Inquiry</div>

        <h1>Book With Eric</h1>

       <div style="margin-top: 40px;">

    <iframe
        data-tally-src="https://tally.so/embed/GxXJ6o"
        loading="lazy"
        width="100%"
        height="1200"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
      title="Eric Saner Consult Request Form">
    </iframe>

</div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="site-wrap footer-row">
      <span>© <span id="year"></span> Eric Saner Tattoo</span>
      <span>Omaha, Nebraska • Custom Tattoo Work</span>
    </div>
  </footer>
<script async src="https://tally.so/widgets/embed.js"></script>
  <!-- Auto-updating copyright year -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
